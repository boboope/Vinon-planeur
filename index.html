<style>
:root{--ink:#111B30;--paper:#F7F5EF;--card:#fff;--muted:#5B6678;--line:#E3E0D6;--ok:#1F8A4C;--warn:#B77A0B;--bad:#B93A2C;--run:#6B7A90;--acc:#0E6F7A}
*{box-sizing:border-box}

.dot.run{background:transparent;border:2.5px solid var(--run);border-top-color:transparent;animation:spin 1s linear infinite}

@media (prefers-reduced-motion:reduce){.dot.run{animation:none;border-top-color:var(--run)}}
.rows b{font-weight:700}
.rows .d{grid-column:2;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.sec{background:#E9E6DC;color:var(--ink)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0}

pre.log{background:#0F1729;color:#DCE4F2;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border-radius:12px;padding:10px 12px;max-height:210px;overflow:auto;white-space:pre-wrap;margin:10px 0 0}
.verdict{border-radius:12px;padding:12px 14px;margin:10px 0 0;font-weight:600;background:#EEF4EF;border:1px solid #CFE2D4}
.verdict.warn{background:#FBF3E2;border-color:#EBD6A6}.verdict.bad{background:#FBEAE7;border-color:#EBC3BC}

textarea{width:100%;min-height:210px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#FBFAF6;color:var(--ink)}
[hidden]{display:none!important}

"use strict";
/* ================================================================================================
   Test réseau — Planeur de poche (AAVA, Vinon-sur-Verdon)
   One file, no library, no account, nothing stored. For a given place and set of devices it answers three questions:
   1. Can this browser reach the free public relays two devices could use to find each other (signalling)?
   2. Can it get an outside address through STUN (UDP), and how hard is the box (NAT) in front of it?
   3. Can two devices open a direct link (WebRTC data channel), how fast, and is it local or through the internet?
   Pairing messages are encrypted in the browser with a key derived from the code (AES-GCM): the relays only see noise.
   The report it prints contains no address, name or identifier.
   ================================================================================================ */

// ---------- what is tested (an automated test harness may replace it before load; the address cannot) ----------
const CFG = window.__VNT_TEST__ || {
  ntfy: [{ name: "ntfy.sh", base: "https://ntfy.sh", port: 443 }],
  mqtt: [                                             // user and pass are the public ones these services publish for anyone
    { name: "shiftr.io", url: "wss://public.cloud.shiftr.io/", port: 443, user: "public", pass: "public" },
    { name: "TBMQ", url: "wss://demo.tbmq.io/mqtt", port: 443, user: "demo" },
    { name: "EMQX", url: "wss://broker.emqx.io:8084/mqtt", port: 8084 },
    { name: "HiveMQ", url: "wss://broker.hivemq.com:8884/mqtt", port: 8884 },
    { name: "Mosquitto", url: "wss://test.mosquitto.org:8081/", port: 8081 }
  ],
  stun: [
    { name: "Google", url: "stun:stun.l.google.com:19302" },
    { name: "Cloudflare", url: "stun:stun.cloudflare.com:3478" },
    { name: "Nextcloud (443)", url: "stun:stun.nextcloud.com:443" }
  ]
};
const VER = "1.2", TIMEOUT_REL = 9000, TIMEOUT_PAIR = 30000;

// ---------- texts ----------
const TX = {
  fr: {
    title: "Test réseau · Planeur de poche", sub: "Association Aéronautique Verdon Alpilles (AAVA) · à faire sur place, avec les appareils qui serviront.",

    h2: "2 · Deux appareils", n2: "Sur un premier appareil, crée un code. Sur le deuxième, saisis-le : les deux appareils essaient de se parler directement. À faire deux fois : un téléphone en 4G (Wi-Fi coupé, et sans partage de connexion ni câble vers l’autre appareil) et l’autre appareil sur le Wi-Fi du lieu ; puis les deux sur le même Wi-Fi.",
    netLbl: "Cet appareil est connecté par :", netW: "Wi-Fi", netM: "4G / 5G", netC: "Câble", p_pick: "Indique d’abord comment cet appareil est connecté : Wi-Fi, 4G / 5G ou câble.",
    host: "Créer un code", or: "ou", join: "Connecter", hostHint: "Saisis ce code sur l’autre appareil (garde cette page ouverte) :",

    r_env: "Navigateur", r_net: "Connexion annoncée", r_ntfy: "Relais ntfy.sh (port {p})", r_mqtt: "Relais MQTT {n} (port {p})", r_stun: "STUN {n}", r_nat: "Boîtier du réseau (NAT)", r_cand: "Adresses locales",

    nat_multi: "{n} adresses publiques IPv4 : cet appareil a sans doute plusieurs connexions actives en même temps (Wi-Fi et partage de connexion d’un téléphone, VPN…). À interpréter avec prudence.", nat_v6only: "seule une adresse IPv6 a répondu : rien à conclure pour l’IPv4.", nat_v6: " Une adresse IPv6 publique est aussi présente.", nat_unknown: "indéterminé (STUN inaccessible).", nat_one: "un seul serveur a répondu : indéterminé.",

    role_host: "créateur du code", role_guest: "invité", link_local: "même réseau", link_net: "à travers Internet", link_relay: "par un relais", link_unknown: "même réseau ou Internet : non déterminé",
    sp_yes: "oui", sp_no: "non", sp_unk: "inconnu", un_wifi: "Wi-Fi", un_mobile: "4G/5G", un_cable: "câble", un_none: "connexion non indiquée",
    rp_ev: " · indices : {lt}/{rt}, même adresse publique : {sp} · autre appareil : {pn}",
    rp_pairline: "{role} : lien direct, {link} ; médiane {med} ms (min {min}, max {max}), pertes {loss} %{proto}{ev}", rp_hostline: "{role} : lien direct, {link}{proto}{ev}", rp_failline: "{role} : pas de lien direct"
  },
  en: {
    title: "Network test · Pocket Glider", sub: "Association Aéronautique Verdon Alpilles (AAVA) · to run on site, with the devices that will be used.",
    h1: "1 · This browser and this network", rerun: "Run the tests again",
    n1: "This page sends no personal data. It contacts free public services (ntfy.sh, public MQTT servers, STUN servers run by Google, Cloudflare and Nextcloud): they see the device’s IP address, like any website.",
    h2: "2 · Two devices", n2: "On a first device, create a code. On the second, type it in: the two devices try to talk to each other directly. Do it twice: one phone on 4G (Wi-Fi off, and no hotspot or cable to the other device) with the other device on the venue’s Wi-Fi; then both on the same Wi-Fi.",
    netLbl: "This device is connected by:", netW: "Wi-Fi", netM: "4G / 5G", netC: "Cable", p_pick: "First say how this device is connected: Wi-Fi, 4G / 5G or cable.",
    host: "Create a code", or: "or", join: "Connect", hostHint: "Type this code on the other device (keep this page open):",
    h3: "3 · Report to copy", copy: "Copy the report", copied: "Copied.", n3: "The report contains no IP address and no name: you can paste it into a message to whoever is organising the test.",
    r_env: "Browser", r_net: "Declared connection", r_ntfy: "ntfy.sh relay (port {p})", r_mqtt: "MQTT relay {n} (port {p})", r_stun: "STUN {n}", r_nat: "Network box (NAT)", r_cand: "Local addresses",
    ok: "OK", blocked: "unreachable", timeout: "no answer", noecho: "connected, but the test message did not come back", ms: "round trip {ms} ms",
    env_ok: "Everything is there: HTTPS, WebRTC, encryption, WebSocket.", env_bad: "Missing: {list}.", env_enc: "encryption (WebCrypto)",
    net_none: "not provided by the browser",
    stun_ok: "public address obtained in {ms} ms", stun_none: "no answer (UDP blocked, or no access)",
    nat_easy: "favourable: every server sees the same address and port.", nat_hard: "probably difficult: the port changes with the server (symmetric NAT). A direct link across the internet may fail; on the same local network it usually works.",
    nat_multi: "{n} public IPv4 addresses: this device probably has several active connections at once (Wi-Fi and a phone’s hotspot, a VPN…). Interpret with care.", nat_v6only: "only an IPv6 address answered: nothing to conclude for IPv4.", nat_v6: " A public IPv6 address is also present.", nat_unknown: "undetermined (STUN unreachable).", nat_one: "only one server answered: undetermined.",
    cand_mdns: "hidden by the browser (mDNS, normal)", cand_ip: "visible (local IP addresses)", cand_none: "none obtained", cand_v6: " · IPv6 present", cand_v4: " · IPv4 present",

    role_host: "code creator", role_guest: "guest", link_local: "same network", link_net: "across the internet", link_relay: "through a relay", link_unknown: "same network or internet: not determined",

    rp_pairline: "{role}: direct link, {link}; median {med} ms (min {min}, max {max}), loss {loss} %{proto}{ev}", rp_hostline: "{role}: direct link, {link}{proto}{ev}", rp_failline: "{role}: no direct link"
  }
};
let lang = /^fr/i.test(navigator.language || "fr") ? "fr" : "en";
const t = (k, p) => { let s = TX[lang][k] != null ? TX[lang][k] : k; if (p) for (const q in p) s = s.split("{" + q + "}").join(p[q]); return s; };
const $ = id => document.getElementById(id);

// ---------- helpers ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const withTimeout = (p, ms, label) => new Promise((res, rej) => { const h = setTimeout(() => rej(new Error(label || "timeout")), ms); p.then(v => { clearTimeout(h); res(v); }, e => { clearTimeout(h); rej(e); }); });
const rnd = (n = 8) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, "0")).join(""); };
const hex = u => Array.from(u, b => b.toString(16).padStart(2, "0")).join("");
const b64 = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
const now = () => performance.now();
function logLine(s) { const el = $("log"); el.hidden = false; el.textContent += new Date().toTimeString().slice(0, 8) + "  " + s + "\n"; el.scrollTop = el.scrollHeight; }
const errKind = e => e && e.message === "timeout" ? "timeout" : e && e.message === "no echo" ? "noecho" : "blocked";

// ================================================================================================
// Results, kept as data and drawn by render() (so the language can change at any time)
// ================================================================================================
const RES = { env: null, conn: "", userNet: "", relays: [], stun: [], nat: null, natN: 0, cand: null, pair: {}, done: false };

function uaShort() {
  const u = navigator.userAgent || ""; let b = "?", m;
  if ((m = /(Edg|EdgA|EdgiOS)\/(\d+)/.exec(u))) b = "Edge " + m[2];
  else if ((m = /(OPR|Opera)\/(\d+)/.exec(u))) b = "Opera " + m[2];
  else if ((m = /(CriOS|Chrome)\/(\d+)/.exec(u))) b = "Chrome " + m[2];
  else if ((m = /(FxiOS|Firefox)\/(\d+)/.exec(u))) b = "Firefox " + m[2];
  else if ((m = /Version\/(\d+)[\d.]*.*Safari/.exec(u))) b = "Safari " + m[1];
  const os = /Android/.test(u) ? "Android" : /iPhone|iPad|iPod/.test(u) ? "iOS" : /Windows/.test(u) ? "Windows" : /Mac OS X|Macintosh/.test(u) ? "macOS" : /CrOS/.test(u) ? "ChromeOS" : /Linux/.test(u) ? "Linux" : "?";
  return b + " / " + os;
}
function checkEnv() {
  const miss = [];
  if (!window.isSecureContext) miss.push("HTTPS");
  if (!window.RTCPeerConnection) miss.push("WebRTC");
  if (!(window.crypto && crypto.subtle)) miss.push("*enc");
  if (!window.WebSocket) miss.push("WebSocket");
  if (!window.EventSource) miss.push("EventSource");
  RES.env = { miss, ua: uaShort() };
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  RES.conn = c ? [c.type, c.effectiveType, c.rtt != null ? "rtt " + c.rtt + " ms" : "", c.downlink != null ? c.downlink + " Mb/s" : ""].filter(Boolean).join(" · ") : "";
}

// ================================================================================================
// Signalling transports. Each: open(topic, onText) -> Promise<{ send(text), close() }>. All carry the same opaque text.
// ================================================================================================
const ntfyTransport = c => ({
  name: c.name,
  open(topic, onText) {
    return new Promise((resolve, reject) => {
      let es, done = false;
      try { es = new EventSource(c.base + "/" + topic + "/sse"); } catch (e) { return reject(e); }
      const h = setTimeout(() => { if (!done) { done = true; try { es.close(); } catch (_) { } reject(new Error("timeout")); } }, TIMEOUT_REL);
      const api = {
        send: text => fetch(c.base + "/" + topic + "?cache=no", { method: "POST", body: text, headers: { "Content-Type": "text/plain" } }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); }),

  const got = { r: new Map(), u: new Set() };
  function onData(dc, kind, m) {
    if (m.k === "p") { try { dc.send(JSON.stringify({ k: "e", i: m.i, t: m.t })); } catch (_) { } }
    else if (m.k === "e") { if (kind === "r") got.r.set(m.i, now() - m.t); else got.u.add(m.i); }
    else if (m.k === "hi") { C.peerNet = NETS.includes(m.net) ? m.net : ""; C.gotHi = true; if (role === "guest" && !C.hiSent) { C.hiSent = true; sayHi(dc); } }
    else if (m.k === "res") {
      RES.pair.guest = cleanResult(m.r); if (!C.peerNet) C.peerNet = RES.pair.guest.un; logLine(t("p_res")); showPairResult(); render();
      evidence().then(ev => { if (!alive()) return; RES.pair.host = Object.assign({ ok: true }, ev); showPairResult(); render(); });   // by now every address has arrived: look again
    }
  }
  async function onConnected() {
    if (role === "guest") {
      for (let i = 0; i < 20 && alive() && !C.gotHi; i++) await sleep(100);           // wait for the other side's first word (2 s at most)
      if (!C.hiSent) { C.hiSent = true; sayHi(C.dcR); }
      logLine(t("p_test")); const N = 30;
      for (let i = 0; i < N && alive(); i++) { try { C.dcR.send(JSON.stringify({ k: "p", i, t: now() })); } catch (_) { } await sleep(120); }
      await sleep(700);
      for (let i = 0; i < N && alive(); i++) { try { C.dcU.send(JSON.stringify({ k: "p", i, t: now() })); } catch (_) { } await sleep(60); }
      await sleep(900); if (!alive()) return;
      const rt = [...got.r.values()].map(x => Math.round(x)), ev = await evidence(); if (!alive()) return;
      C.mine = Object.assign({ ok: true, med: Math.round(median(rt)), min: rt.length ? Math.min(...rt) : 0, max: rt.length ? Math.max(...rt) : 0, loss: Math.round(100 * (N - got.u.size) / N), n: rt.length }, ev);
      RES.pair.guest = C.mine; logLine(t("p_done"));
      try { C.dcR.send(JSON.stringify({ k: "res", r: C.mine })); } catch (_) { }
      showPairResult(); render(); finish();
    } else {
      const ev = await evidence(); if (!alive()) return;
      if (!RES.pair.host || RES.pair.host.ok === false || !RES.pair.guest) RES.pair.host = Object.assign({ ok: true }, ev);
      showPairResult(); render(); setTimeout(() => { if (alive()) finish(); }, 8000);
    }
  }
  function showPairResult() {
    const r = RES.pair.guest || (RES.pair.host && RES.pair.host.med != null ? RES.pair.host : null);
    if (!r || !r.ok) return; const own = RES.pair[role === "host" ? "host" : "guest"], link = own && own.ok && own.link !== "unknown" ? own.link : r.link;
    verdict2(link === "unknown" ? "warn" : "ok", t("v2_" + link), t("v2_d", { med: r.med, min: r.min, max: r.max, loss: r.loss }));
  }
  chan.onmsg = async m => {
    if (!alive()) return;
    if (role === "host") {
      if (m.t === "hello") {
        if (!C.started) {
          C.started = true; logLine(t("p_hello", { via: m.via }));
          const pc = mkPc(); wire(pc.createDataChannel("r"), "r"); wire(pc.createDataChannel("u", { ordered: false, maxRetransmits: 0 }), "u");
          await pc.setLocalDescription(await pc.createOffer()); C.offer = pc.localDescription.sdp; await chan.post({ t: "offer", sdp: C.offer }); logLine(t("p_offer"));
        } else if (!C.connected && C.offer) await chan.post({ t: "offer", sdp: C.offer });      // the guest still asks: say it again
      } else if (m.t === "answer" && C.pc && !C.remoteSet) { noteSdp(m.sdp); await C.pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); await flush(); }
      else if (m.t === "cand") { if (C.remoteSet) await addCand(m.c); else C.pend.push(m.c); }
    } else {
      if (m.t === "offer" && !C.pc) {
        logLine(t("p_hello", { via: m.via })); clearInterval(C.hello);
        const pc = mkPc(); pc.ondatachannel = e => wire(e.channel, e.channel.label === "u" ? "u" : "r");
        noteSdp(m.sdp); await pc.setRemoteDescription({ type: "offer", sdp: m.sdp }); await flush();
        await pc.setLocalDescription(await pc.createAnswer()); await chan.post({ t: "answer", sdp: pc.localDescription.sdp }); logLine(t("p_answer"));
      } else if (m.t === "cand") { if (C.remoteSet) await addCand(m.c); else C.pend.push(m.c); }
    }
  };
  const fail = () => {
    if (!alive() || C.connected) return;
    const heard = role === "host" ? C.started : !!C.pc;
    if (!heard) { logLine(t("p_nopeer", { s: TIMEOUT_PAIR / 1000 })); verdict2("bad", t("v2_fail"), t("p_nopeer", { s: TIMEOUT_PAIR / 1000 })); }
    else { logLine(t("p_fail", { s: TIMEOUT_PAIR / 1000 })); logLine(t("p_cand", { c: [...C.types].join(", ") || "—" })); RES.pair[role === "host" ? "host" : "guest"] = { ok: false, un: RES.userNet, pn: C.peerNet }; verdict2("bad", t("v2_fail"), t("v2_fail_d")); render(); }
    stopPairing(); finish();
  };
  C.timer = setTimeout(fail, TIMEOUT_PAIR);
  if (role === "guest") { const hello = () => chan.post({ t: "hello" }); await hello(); C.hello = setInterval(() => { if (alive() && !C.pc) hello(); }, 1500); }
}

// ================================================================================================
// Report (no address, no name)
// ================================================================================================
function buildReport() {
  const L = [], d = new Date(), z = n => String(n).padStart(2, "0");
  L.push(t("rp_head") + " (v" + VER + ") · " + z(d.getDate()) + "/" + z(d.getMonth() + 1) + "/" + d.getFullYear() + " " + z(d.getHours()) + ":" + z(d.getMinutes()));
  if (RES.env) L.push(t("rp_dev") + " : " + RES.env.ua + (RES.env.miss.length ? " · " + t("env_bad", { list: RES.env.miss.map(m => m === "*enc" ? t("env_enc") : m).join(", ") }) : ""));
  L.push(t("rp_conn") + " : " + (RES.conn || t("net_none")));
  L.push(t("rp_unet") + " : " + t("un_" + (RES.userNet || "none")));
  const rs = RES.relays.map(r => r.name + (r.kind === "ntfy" ? " (" + r.port + ")" : " (" + r.port + ")") + " " + (r.state === "ok" ? "OK " + r.ms + " ms" : r.state === "run" ? "…" : t(r.state)));
  L.push(t("rp_relays") + " : " + (rs.join(" · ") || t("rp_none")));
  const ss = RES.stun.map(s => s.name + " " + (s.state === "ok" ? "OK " + s.ms + " ms" : s.state === "run" ? "…" : t("stun_none").split(" (")[0]));
  L.push(t("rp_stun") + " : " + (ss.join(" · ") || t("rp_none")));
  L.push(t("rp_nat") + " : " + (RES.nat ? t("nat_" + RES.nat, { n: RES.natN }) + (RES.natV6 ? t("nat_v6") : "") : "…"));
  const c = RES.cand; L.push(t("rp_cand") + " : " + (c ? (c.n ? (c.mdns ? t("cand_mdns") : t("cand_ip")) + (c.v4 ? t("cand_v4") : "") + (c.v6 ? t("cand_v6") : "") : t("cand_none")) : "…"));
  const P = [["host", "role_host"], ["guest", "role_guest"]].map(([k, rk]) => {
    const r = RES.pair[k]; if (!r) return null;
    const role = t(rk) + " (" + t("un_" + (r.un || "none")) + ")", proto = (r.proto ? ", " + r.proto : "") + (r.net && r.net !== "unknown" ? " · " + r.net : "");
    const ev = t("rp_ev", { lt: r.lt || "?", rt: r.rt || "?", sp: t(r.sp === true ? "sp_yes" : r.sp === false ? "sp_no" : "sp_unk"), pn: t("un_" + (r.pn || "none")) });
    if (!r.ok) return t("rp_failline", { role });
    if (r.med == null) return t("rp_hostline", { role, link: t("link_" + (r.link || "unknown")), proto, ev });
    return t("rp_pairline", { role, link: t("link_" + (r.link || "unknown")), med: r.med, min: r.min, max: r.max, loss: r.loss, proto, ev });
  }).filter(Boolean);
  L.push(t("rp_pair") + " : " + (P.length ? "" : t("rp_none"))); P.forEach(x => L.push("  " + x));
  return L.join("\n");
}

// ================================================================================================
// Wiring
// ================================================================================================
function setLang(l) { lang = l; render(); }
document.addEventListener("DOMContentLoaded", () => {
  $("lgFR").onclick = () => setLang("fr"); $("lgEN").onclick = () => setLang("en");
  $("btnRerun").onclick = () => runTests();
  const needNet = () => { if (RES.userNet) return false; verdict2("warn", t("p_pick")); $("netSeg").classList.add("need"); try { $("netSeg").scrollIntoView({ block: "center" }); } catch (_) { } return true; };
  NETBTN.forEach(([id, v]) => { $(id).onclick = () => { RES.userNet = v; $("netSeg").classList.remove("need"); if ($("v2").textContent === t("p_pick")) verdict2(null); render(); }; });
  $("btnHost").onclick = async () => { if (needNet()) return; const code = newCode(); $("hostBox").hidden = false; $("codeShow").textContent = fmtCode(code); await startPairing("host", code); };
  $("btnJoin").onclick = async () => { if (needNet()) return; const code = normCode($("code").value); if (!validCode(code)) { verdict2("bad", t("p_bad")); return; } $("hostBox").hidden = true; await startPairing("guest", code); };
  $("code").addEventListener("input", e => { const v = normCode(e.target.value).slice(0, 8); e.target.value = v.length > 4 ? v.slice(0, 4) + "-" + v.slice(4) : v; });
  $("code").addEventListener("keydown", e => { if (e.key === "Enter") $("btnJoin").click(); });
  $("btnCopy").onclick = async () => { const ta = $("rep"); ta.value = buildReport(); try { await navigator.clipboard.writeText(ta.value); } catch (_) { ta.select(); try { document.execCommand("copy"); } catch (__) { } } $("copied").textContent = t("copied"); setTimeout(() => $("copied").textContent = "", 2500); };
  render(); runTests();
});
window.__vnt = { RES, render, buildReport, startPairing, stopPairing, runTests, linkKind, privAddr, same64, cleanResult };
