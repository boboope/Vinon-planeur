<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Le Planeur de poche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: full-bleed 3D sky, instruments pinned to the safe-area edges, flight cards for the screens */
:root{
  --ink:#1D2B4A; --ink2:#2A3A5E; --ink3:#3A4A72; --sun:#E8A33D; --sunl:#F7DDA9; --lav:#8C7DB8; --verdon:#2E8B83;
  --paper:#FFFFFF; --mist:#F3F6FA; --line:#D8DFEA; --muted:#5E6B88; --alert:#D9534F; --glass:rgba(17,27,48,.64);
  --display:'Lora', Georgia, 'Times New Roman', serif;
  --ui:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;color:#fff;user-select:none;-webkit-user-select:none}
#hud .panel{background:var(--glass);border-radius:18px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-tl{position:absolute;left:calc(12px + var(--sl));top:calc(12px + var(--st));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vario{display:flex;align-items:center;gap:10px}
.vario svg{width:78px;height:46px;flex:none}
.vario .big{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.vario .small{font-size:12px;opacity:.8;margin-top:3px}
.iconrow{display:flex;gap:8px;pointer-events:auto}
.icon{width:42px;height:42px;border-radius:14px;border:0;background:var(--glass);color:#fff;display:flex;align-items:center;justify-content:center}
.icon svg{width:20px;height:20px}
.icon.x2 span{font-weight:800;font-size:15px;letter-spacing:-.02em}
.icon.x2[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.hud-tc{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + var(--st));display:flex;flex-direction:column;align-items:center;gap:8px}
.pill{background:var(--glass);border-radius:999px;padding:9px 18px;font-size:22px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill span{font-size:14px;font-weight:600;opacity:.85;margin-left:4px}
.badge{background:var(--sun);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;white-space:nowrap}
.badge.ridge{background:#B9C9DD}.badge.wave{background:#fff}.badge.conv{background:var(--lav);color:#fff}
.hud-tr{position:absolute;right:calc(12px + var(--sr));top:calc(12px + var(--st));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.info{min-width:170px;display:grid;grid-template-columns:auto auto;gap:4px 14px;align-items:baseline;font-variant-numeric:tabular-nums}
.info .k{font-size:12px;opacity:.78}.info .v{font-size:18px;font-weight:700;text-align:right}
.info .home{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.info .home svg{width:16px;height:16px;transition:transform .2s linear}
.ok{color:#9FE3B0}.ko{color:#FFB0A8}
#minimap{width:150px;height:150px;border-radius:50%;display:block}
.notes{position:absolute;left:50%;transform:translateX(-50%);top:calc(110px + var(--st));width:min(440px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(10,18,36,.3)}
.toast .sw{width:44px;height:44px;border-radius:12px;flex:none;background:var(--verdon)}
.toast .kk{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--verdon);text-transform:uppercase}
.toast .tt{font-size:17px;font-weight:700;line-height:1.2}
.toast .dd{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.warn{background:var(--alert);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;text-align:center}
.learn{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(10,18,36,.35)}
.learn .kk{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--sun);text-transform:uppercase}
.learn .tt{font-family:var(--display);font-size:21px;font-weight:600;margin-top:2px}
.learn .dd{font-size:14px;line-height:1.45;opacity:.92;margin-top:4px}
.learn .ff{font-size:12px;opacity:.7;margin-top:6px;font-style:italic}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sb));width:max-content;max-width:min(480px,calc(100% - 300px));background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;text-align:center}
.stick{position:absolute;left:calc(28px + var(--sl));bottom:calc(28px + var(--sb));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55)}
.stick .knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.stick .lbl{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.act{position:absolute;pointer-events:auto;touch-action:none;border:0;border-radius:50%;background:var(--glass);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;user-select:none;-webkit-user-select:none}
.act.on{background:rgba(232,163,61,.9);color:var(--ink)}
.keys{position:absolute;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));background:var(--glass);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5}
.keys b{display:inline-block;min-width:20px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.18);text-align:center;font-weight:700}
.badge-proto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(4px + var(--sb));font-size:10.5px;opacity:.7;white-space:nowrap}
@media (max-width:640px){
  .hud-tc{left:calc(12px + var(--sl));transform:none;align-items:flex-start;top:calc(122px + var(--st))}
  .pill{font-size:16px;padding:6px 12px}
  .pill span{font-size:11px}
  .badge{font-size:12.5px;padding:5px 12px}
  #hud .panel{padding:7px 9px;border-radius:14px}
  .info{min-width:0;gap:1px 8px}
  .info .k{font-size:11px}.info .v{font-size:14px}
  .vario svg{width:58px;height:35px}
  .vario .big{font-size:20px}
  .icon{width:38px;height:38px;border-radius:12px}
  #minimap{width:112px;height:112px}
  .notes{top:calc(236px + var(--st))}
  .toast{padding:10px 12px}.toast .tt{font-size:15.5px}.toast .dd{font-size:12.5px}
  .learn{padding:12px 14px}.learn .tt{font-size:18px}.learn .dd{font-size:13px}
  .stick{width:128px;height:128px}
  .hint{bottom:calc(190px + var(--sb));max-width:calc(100% - 32px);font-size:13px}
}
@media (max-height:520px) and (min-width:641px){
  .notes{left:calc(12px + var(--sl));transform:none;top:calc(150px + var(--st));width:330px}
  .learn .dd{font-size:13px}
  .hint{bottom:calc(16px + var(--sb))}
}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(29,43,74,.55),rgba(29,43,74,.88));padding-block:calc(20px + var(--st)) calc(28px + var(--sb));padding-left:max(16px, var(--sl));padding-right:max(16px, var(--sr));display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:760px;background:var(--paper);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(8,14,30,.4);margin-block:auto}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#A8661A}
h1,h2,h3{font-family:var(--display);font-weight:600;color:var(--ink);text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,52px);line-height:1.04;margin-top:6px}
h2{font-size:clamp(26px,4.4vw,36px);line-height:1.1;margin-top:6px}
h3{font-size:19px}
.lede{font-size:17px;line-height:1.55;color:#33405E;margin:12px 0 0;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.step{background:var(--mist);border-radius:16px;padding:14px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.step .t{font-weight:700;margin-top:10px;font-size:15.5px}
.step .d{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.energies{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--mist);color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.btn{border:0;border-radius:999px;padding:14px 24px;font-size:16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--sun);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--mist);color:var(--ink)}
.btn.small{padding:10px 16px;font-size:14px}
.seg{display:inline-flex;background:var(--mist);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.legend{margin-top:16px;background:var(--mist);border-radius:16px;padding:14px 16px}
.legend h3{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#A8661A}
.legend ul{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.legend li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.legend svg{width:24px;height:24px;flex:none;background:#1D2B4A;border-radius:7px;padding:2px}
@media (max-width:420px){.legend ul{grid-template-columns:1fr}}
.toggle input{width:18px;height:18px;accent-color:var(--verdon)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:18px}
.tip{font-size:13px;color:var(--muted);margin-top:10px}

/* End screen */
.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.res{background:var(--mist);border-radius:14px;padding:12px 14px}
.res .v{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.res .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bdg{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#E7F3F1;color:#1F6E67}
.bdg.off{background:var(--mist);color:var(--muted)}
.endgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-top:20px;align-items:start}
.mapbox{border-radius:16px;overflow:hidden;background:var(--mist)}
.mapbox canvas{display:block;width:100%;height:auto}
.mapcap{font-size:12px;color:var(--muted);padding:8px 12px}
.ctaMain{display:flex;flex-direction:column;gap:6px;background:var(--ink);color:#fff;border-radius:18px;padding:18px;text-decoration:none}
.ctaMain .kk{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--sun);text-transform:uppercase}
.ctaMain .tt{font-family:var(--display);font-size:23px;font-weight:600}
.ctaMain .go{align-self:flex-start;margin-top:6px;background:var(--sun);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px}
.ctas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.cta{display:flex;flex-direction:column;gap:3px;background:var(--mist);border:0;border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);text-align:left;font-size:14px}
.cta b{font-size:14.5px}
.cta span{color:var(--muted);font-size:12.5px;line-height:1.35}
.cta:hover,.ctaMain:hover{filter:brightness(.97)}
.share{margin-top:20px;background:var(--mist);border-radius:18px;padding:16px}
.share .lines{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.share a,.share button{border:0;border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;background:var(--paper);color:var(--ink);text-decoration:none}
.share textarea{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--paper);resize:none;user-select:text;-webkit-user-select:text}
.cardimg{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;margin-top:14px}
.cardimg img{width:120px;border-radius:12px;box-shadow:0 6px 18px rgba(29,43,74,.2)}
.cardimg p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}

/* Contact */
form{margin-top:16px;display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--ink)}
.f input,.f textarea,.f select{font-family:var(--ui);font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);user-select:text;-webkit-user-select:text}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.social{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px}
fieldset{border:0;padding:0;margin:0}
legend{font-size:14px;font-weight:700;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--mist);font-size:14px;font-weight:600;cursor:pointer}
.choices input{accent-color:var(--verdon);width:16px;height:16px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--ink)}
.consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--verdon);flex:none}
.err{color:var(--alert);font-size:13.5px;font-weight:700}
.sendbox{background:var(--mist);border-radius:16px;padding:16px;margin-top:16px}
.sendbox textarea{width:100%;box-sizing:border-box;min-height:170px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--paper);user-select:text;-webkit-user-select:text}
.dest{font-size:15px;font-weight:700;margin-top:10px;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.ph{background:#FFF3DC;color:#8A5A12;border-radius:6px;padding:1px 6px}
.ph.cfg{letter-spacing:.04em;text-transform:none;font-weight:700;border:1px dashed #C98B2B;vertical-align:1px}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}

@media (max-width:640px){
  .card{padding:20px;border-radius:18px}
  .steps{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .endgrid{grid-template-columns:1fr}
  .ctas{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .social{grid-template-columns:110px minmax(0,1fr)}
}

/* ---------- v5: start card, daily task, challenge, end screen ---------- */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.taskcard{margin-top:16px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:16px;align-items:center}
.taskcard .kk{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--sun);text-transform:uppercase}
.taskcard .tt{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2;margin-top:4px;text-wrap:balance}
.taskcard .dd{font-size:13.5px;opacity:.9;margin-top:6px;line-height:1.45}
.taskcard svg{width:132px;height:96px;display:block}
.taskcard .wxl{color:#A9D0F5;opacity:1;font-weight:600;margin-top:4px}
.dare{margin-top:14px;background:#FFF3DC;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:600;color:#5E3D08;line-height:1.4}
.dare b{font-weight:800}
.sponsor{margin-top:8px;font-size:12px;color:var(--muted)}
.sponsor .ph{font-weight:600}
details.how{margin-top:14px;background:var(--mist);border-radius:14px;padding:0 14px}
details.how summary,details.more summary{cursor:pointer;font-weight:700;font-size:14px;padding:11px 0;color:var(--ink)}
details.how .steps{margin:2px 0 4px}
details.how .step{background:var(--paper)}
details.how .energies{margin:10px 0 0}
details.how .tip{margin:10px 0 12px}
details.more{margin-top:8px;background:var(--mist);border-radius:14px;padding:0 14px}
details.more .ctas{margin:0 0 12px}
details.more .cta{background:var(--paper)}
.endtop{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cmp{margin-top:12px;display:grid;gap:8px}
.cmp:empty{display:none}
.cmp div{background:#E7F3F1;color:#1F6E67;border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:700;line-height:1.35}
.cmp div.lose{background:#FFF3DC;color:#7A4A10}
.cmp div.neutral{background:var(--mist);color:var(--ink)}
.medal{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:6px 14px 6px 8px;border-radius:999px;margin-top:12px;background:var(--mist);color:var(--ink)}
.medal i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.namebox{display:grid;gap:6px;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.namebox input{font-family:var(--ui);font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:260px;user-select:text;-webkit-user-select:text}
.share a.minor{background:transparent;color:var(--muted);padding:9px 8px}
.pzinfo{font-size:14px;color:var(--muted);font-weight:600;margin-top:6px}
.pill b{font-weight:800}
.linkbtn{background:none;border:0;padding:8px 0 0;color:var(--muted);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.warn.soft{background:rgba(232,163,61,.95);color:var(--ink)}
.logbook{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.45}
.logbook b{color:var(--ink);font-weight:700}
.row.r-start{margin-top:16px}
.row.r-sound{margin-top:12px}
@media (max-width:640px){
  .taskcard{grid-template-columns:minmax(0,1fr) 96px;gap:12px;padding:14px}
  .taskcard svg{width:96px;height:70px}
  .taskcard .tt{font-size:19px}
  .lede{font-size:16px}

const typoFr = s => s.replace(/ ([;!?])/g, NNB + "$1").replace(/ :/g, NB + ":").replace(/« /g, "«" + NB).replace(/ »/g, NB + "»")

const typoAll = s => s.replace(/([A-Za-zÀ-ÿ])'(?=[A-Za-zÀ-ÿ«])/g, "$1’");
(function walk(o, f) { for (const k in o) { if (typeof o[k] === "string") o[k] = f(o[k]); else if (o[k] && typeof o[k] === "object") walk(o[k], f); } })(TX.fr, s => typoAll(typoFr(s)));

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };

function crestAt(m, uf) {
  const c = m.crest;
  if (uf <= c[0][0] || uf >= c[c.length - 1][0]) return GROUND;
  for (let i = 0; i < c.length - 1; i++) if (uf <= c[i + 1][0]) { const k = (uf - c[i][0]) / (c[i + 1][0] - c[i][0]); return lerp(c[i][1], c[i + 1][1], k); }
  return GROUND;
}
function local(m, x, z) { const a = m.a * D2R, dx = x - m.cx, dz = z - m.cz; return { u: dx * Math.cos(a) + dz * Math.sin(a), v: -dx * Math.sin(a) + dz * Math.cos(a) }; }
// Terrain altitude above sea level
function terrain(x, z) {
  let h = GROUND;
  for (const m of MASSIFS) {
    const p = local(m, x, z);
    if (Math.abs(p.u) < m.L && Math.abs(p.v) < m.W) h = Math.max(h, GROUND + (crestAt(m, p.u / m.L) - GROUND) * (1 - Math.abs(p.v) / m.W));
  }
  for (const c of CONES) { const d = Math.hypot(x - c.x, z - c.z); if (d < c.r) h = Math.max(h, GROUND + (c.h - GROUND) * (1 - d / c.r)); }
  return h;
}
function cloudbase(x, z) { return 1900 + 900 * clamp(-(z + 5000) / 30000, 0, 1) + 300 * clamp(x / 35000, 0, 1); }

function buildGlider() {

  const L = 7.3, Z0 = -3.0;
  const prof = [[0, 0], [.012, .075], [.03, .15], [.06, .225], [.10, .285], [.16, .335], [.24, .36], [.32, .355], [.40, .32], [.48, .255], [.56, .19], [.66, .145], [.78, .115], [.90, .095], [.985, .07], [1, 0]];
  const fus = new THREE.LatheGeometry(prof.map(([s, r]) => new THREE.Vector2(r, s * L)), 28);
  fus.rotateX(Math.PI / 2);
  const fp = fus.attributes.position;
  for (let i = 0; i < fp.count; i++) { const s = fp.getZ(i) / L; fp.setX(i, fp.getX(i) * .86); fp.setY(i, fp.getY(i) + .2 * smooth(.3, 1, s) - .03 * (1 - smooth(0, .4, s))); fp.setZ(i, fp.getZ(i) + Z0); }

  const can = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 16), glass); can.scale.set(.215, .175, 1.08); can.position.set(0, .255, -1.8); g.add(can);

  // wing (built for the right side, mirrored for the left)

  const wingSec = (s, c0, c1, sd) => {

    return airfoil(9, thick(s), c0, c1, .025).map(([xc, yc]) => { const dz = (zl + xc * c) - zq(s), dy = yc * c; return V(x, y0 + dy * Math.cos(tw) - dz * Math.sin(tw), zq(s) + dz * Math.cos(tw) + dy * Math.sin(tw)); });
  };

    g.add(new THREE.Mesh(loft(S_TIP.map(s => wingSec(s, 0, 1, sd)), true, true), accent));
    const ail = loft(S_OUT.map(s => wingSec(s + (s === .52 ? .004 : s === .95 ? -.004 : 0), HA + .006, 1, sd)), true, true);
    const te = wingSec(.74, 1, 1, sd)[0];

      const s = .3, c = chord(s), zl = zq(s) - .25 * c, plate = new THREE.BoxGeometry(1.5, .014, .36); plate.translate(0, 0, -.18);

      const pv = new THREE.Group(); pv.add(pl); pv.position.set(sd * (X0 + s * (B - X0)), wy(s) + .078, zl + .64 * c); pv.visible = false; g.add(pv); GL.brk.push(pv);

    return airfoil(8, .1, c0, c1, 0).map(([xc, yc]) => V(yc * c, y, zl + xc * c)); };
  const finPt = k => { const c = lerp(1.05, .6, k); return V(0, lerp(finY0, finY1, k), lerp(3.22, 3.86, k) + RH * c); };

  const stabSec = (k, c0, c1, sd) => { const c = lerp(.68, .38, k), zl = lerp(3.78, 3.98, k);
    return airfoil(8, .1, c0, c1, 0).map(([xc, yc]) => V(sd * k * SB, SY + yc * c, zl + xc * c)); };

  [1, -1].forEach(sd => {
    g.add(new THREE.Mesh(loft([0, .5, 1].map(k => stabSec(k, 0, EH, sd)), false, true), gel));
    GL.elev[sd > 0 ? 0 : 1] = hinge(loft([.02, .5, 1].map(k => stabSec(k, EH + .01, 1, sd)), true, true), surf, stabPt(0, sd), stabPt(1, sd), g, stabSec(.5, 1, 1, sd)[0], V(0, 1, 0));

}

/* control surfaces and attitude follow the pilot's inputs and the glider's motion */
function animateGlider(dt) {
  const rollRate = (S.phi - S.prevPhi) / Math.max(dt, 1e-3); S.prevPhi = S.phi;
  const rollN = clamp(rollRate / (70 * D2R), -1, 1);
  const tA = clamp(.75 * rollN + .3 * IN.steer, -1, 1);                                   // right wing TE up when rolling right
  const tE = clamp(-(S.Vt - S.V) / 10 + 1.3 * (1 / Math.cos(S.phi) - 1), -1, 1); // pull to slow down and in turns
  const tR = clamp(.7 * rollN + .3 * IN.steer + (LV().pedals ? S.ped : 0), -1, 1);                                     // coordinated rudder into the roll
  const k = Math.min(1, dt * 12); S.ctl.a += (tA - S.ctl.a) * k; S.ctl.e += (tE - S.ctl.e) * k; S.ctl.r += (tR - S.ctl.r) * k;
  const a = S.ctl.a, up = 27 * D2R, down = 16 * D2R;                                         // differential ailerons
  deflect(GL.ail[0], a > 0 ? a * up : a * down);
  deflect(GL.ail[1], a > 0 ? -a * down : -a * up);
  GL.elev.forEach(h => deflect(h, S.ctl.e * 24 * D2R));
  deflect(GL.rud, S.ctl.r * 26 * D2R);
  { const ab = LV().brake ? IN.brake : 0; GL.brk.forEach(p => { p.visible = ab > .02; p.rotation.x = ab * 68 * D2R; }); }
  // pitch: flight path through the air + angle of attack (higher when slow) + nose-down while accelerating
  const alpha = clamp(5.4 * (22 / S.V) ** 2, .6, 8) * D2R, gamma = -Math.atan(S.sinkAir / S.V);
  const tr = -Math.asin(clamp(S.acc / G, -.7, .7));   // nose down while the speed builds (a dive), nose up while it bleeds off
  S.theta += (gamma + alpha + tr + S.nose - S.theta) * Math.min(1, dt * 3);
}

/* ---------------- Input ----------------
   One stick, the same in both views. It stays where it is left, as if the glider were trimmed there: the bank and the
   speed hold, so circling in a thermal needs no button. Drag it with a finger or the mouse, or move it with the arrow keys.
   Space, or two quick taps, brings it back to the centre. Two soft notches help: wings level, and neutral speed.
   Where the stall exists (levels 2 and 3), the stick also meets a soft stop on its way back: up to the stop the wing keeps

/* ---------------- Boot ---------------- */
function onResize() {

  renderer.setSize(w, h, false); refreshControls();
  if (CK.on) { layoutCockpit(); camera.fov = 2 * CK.up; camera.setViewOffset(w, 2 * CK.horizon, 0, 0, w, h); CK.cache = {}; if (S.state) cockpitFrame(0); } // the horizon sits above the panel: the picture is shifted, not tilted
  else { if (camera.view) camera.clearViewOffset(); camera.aspect = w / h; camera.fov = w < h ? 72 : 60; camera.updateProjectionMatrix(); }
}

  { const lh = parseLevelHash(location.hash); if (lh) { STORE.level = lh; saveStore(); } }
  RUN.dare = parseDare(location.hash); RUN.lvTmp = RUN.dare ? RUN.dare.lv : 0;
  $("optSound").checked = soundOn = STORE.sound !== false;
  VIEW = (STORE.view || CONFIG.defaultView) === "cockpit" ? "cockpit" : "chase"; $("optCockpit").checked = VIEW === "cockpit"; $("btnView").setAttribute("aria-pressed", VIEW === "cockpit" ? "true" : "false");

  $("lgFR").addEventListener("click", () => { lang = "fr"; applyLang(); });
  $("lgEN").addEventListener("click", () => { lang = "en"; applyLang(); });

  $("optCockpit").addEventListener("change", () => setView($("optCockpit").checked ? "cockpit" : "chase"));
